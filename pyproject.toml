[project]
name = "nightreign-overlay-helper"
dynamic = ["version"]
description = "An overlay helper for ELDEN RING NIGHTREIGN, built with PyQt6 and PyQt-Fluent-Widgets."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "NeuraXmy" }]
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.7",
    "PyQt6-Fluent-Widgets>=1.11,<1.12",
    "numpy>=2",
    "mss>=10",
    "Pillow>=10",
    "opencv-python>=4.10",
    "onnxruntime>=1.20,<2",
    "platformdirs>=4",
    "pygame>=2.6",
    "pynput>=1.7",
    "pyyaml>=6",
]

[project.scripts]
nightreign-overlay-helper = "nightreign_overlay.__main__:main"

[dependency-groups]
build = [
    "pyinstaller>=6.11,<7",
    "packaging>=24",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
nuitka = [
    "nuitka>=2.8,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/nightreign_overlay/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nightreign_overlay"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = [
    "N802",   # Qt overrides such as paintEvent / closeEvent use camelCase
    "N815",   # Qt signals use camelCase (valueChanged) to match Qt conventions
    "RUF001", # full-width punctuation is expected in Chinese strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["nightreign_overlay"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["benchmark: expensive detector evaluation, run explicitly after relevant detection changes"]
