name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify native DLL
        shell: pwsh
        run: |
          if (-not (Test-Path "native/MaaWin32Screencap.dll" -PathType Leaf)) {
            Write-Error "native/MaaWin32Screencap.dll not found. Ensure the DLL is committed to the repository."
            exit 1
          }
          Write-Host "native/MaaWin32Screencap.dll verified."

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        
      - name: Install dependency
        run: uv sync

      - name: Verify project version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          uv run python scripts/ci_version.py --tag "${{ github.ref_name }}" --file pyproject.toml --check --set-github-env
        
      - name: Build with PyInstaller
        run: uv run pyinstaller --name "nightreign-overlay-helper" --windowed --onefile --distpath "dist\nightreign-overlay-helper" --icon="assets\icon.ico" --add-data "pyproject.toml;." --add-binary "native\MaaWin32Screencap.dll;native" src\app.py

      - name: Verify build artifact contains native DLL
        shell: pwsh
        run: |
          $exe = "dist\nightreign-overlay-helper\nightreign-overlay-helper.exe"
          if (-not (Test-Path $exe -PathType Leaf)) {
            Write-Error "Build artifact not found: $exe"
            exit 1
          }
          $null = findstr /C:"MaaWin32Screencap.dll" $exe
          if ($LASTEXITCODE -ne 0) {
            Write-Error "MaaWin32Screencap.dll signature not found in build artifact. Check --add-binary parameter."
            exit 1
          }
          Write-Host "Build artifact verified: contains MaaWin32Screencap.dll."
        
      - name: Copy additional files
        run: |
          xcopy /E /I /Y "assets" "dist\nightreign-overlay-helper\assets"
          xcopy /E /I /Y "data" "dist\nightreign-overlay-helper\data"
          copy "manual.txt" "dist\nightreign-overlay-helper\manual.txt"
          copy "config.yaml" "dist\nightreign-overlay-helper\config.yaml"
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nightreign-overlay-helper-windows
          path: dist\nightreign-overlay-helper\
          retention-days: 30

      - name: Package for Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        shell: pwsh
        run: |
          # 从 github.ref_name 获取标签名，例如 "v1.0.0"
          $version = "${{ github.ref_name }}"
          # 构造 zip 文件名，例如 "nightreign-overlay-helper-v1.0.0.zip"
          $zipName = "nightreign-overlay-helper-$version.zip"
          # 使用 PowerShell 的 Compress-Archive 命令创建 zip 文件
          Compress-Archive -Path "dist/nightreign-overlay-helper/*" -DestinationPath "dist/$zipName"
          Write-Host "Created zip file: dist/$zipName"
          
      - name: Create Release and Upload
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: dist/nightreign-overlay-helper-${{ github.ref_name }}.zip
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
