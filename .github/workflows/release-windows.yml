name: Release Windows ZIP

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      artifact-ids: ${{ steps.upload-runtime.outputs.artifact-id }},${{ steps.upload-sources.outputs.artifact-id }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      CI: '1'
      # Use the public index on GitHub-hosted runners.
      UV_DEFAULT_INDEX: https://pypi.org/simple

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install locked dependencies
        run: uv sync --locked --python 3.13 --group build

      - name: Check release tag against application version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: uv run --no-sync python scripts/validate_release_version.py "$env:GITHUB_REF_NAME"

      - name: Determine release channel
        id: version
        shell: uv run --no-sync python {0}
        run: |
          import os
          from packaging.version import Version
          from nightreign_overlay import __version__

          version = Version(__version__)
          prerelease = str(version.is_prerelease or version.is_devrelease).lower()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"prerelease={prerelease}\n")

      - name: Lint source
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Run full regression suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: uv run --no-sync pytest -q --durations=20

      - name: Load runtime resources and discover plugins
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: uv run --no-sync python scripts/check_runtime_resources.py

      - name: Build application and P2P helper
        shell: cmd
        run: call build.bat

      - name: Verify release licenses and corresponding source
        run: uv run --no-sync python scripts/prepare_release_licenses.py --check

      - name: Create runtime and source ZIPs
        id: package
        run: uv run --no-sync python -m scripts.package_release

      - name: Upload Windows runtime ZIP
        id: upload-runtime
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          archive: false
          retention-days: 30

      - name: Upload corresponding source ZIP
        id: upload-sources
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.sources-path }}
          if-no-files-found: error
          archive: false
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified runtime and source ZIPs
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-windows.outputs.artifact-ids }}
          merge-multiple: true
          path: release

      - name: Publish release with runtime and source ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build-windows.outputs.prerelease }}
        shell: bash
        run: |
          args=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$PRERELEASE" == 'true' ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          printf '%s\n' \
            "Windows: nightreign-overlay-helper-${RELEASE_TAG}-windows-x64.zip" \
            "Corresponding source / 对应源码: ${RELEASE_TAG}-sources.zip (same release, free download)." \
            > release-notes.md
          gh release create "$RELEASE_TAG" release/*.zip --notes-file release-notes.md "${args[@]}"
