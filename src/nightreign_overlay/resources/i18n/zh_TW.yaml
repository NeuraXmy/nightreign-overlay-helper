    title: 安全性聲明
    content: 本程式不是《黑夜君臨》的 Mod／插件，而是獨立的應用程式；識別功能主要依靠遊戲畫面截圖和圖像分析，不讀取或寫入任何遊戲程序記憶體，不修改遊戲資料或檔案，不會向遊戲注入程式碼或改變遊戲執行邏輯，也不會擷取遊戲網路封包；因此基本不存在反作弊風險，可以在官方連線模式下使用。
