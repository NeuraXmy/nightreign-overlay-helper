plugin:
  name: 試合後の称賛
  description: 味方の退出後に称賛ウィンドウを表示し、Steam プロフィールの確認やコメントの投稿ができます
settings:
  behavior: 動作
  close_seconds: ウィンドウを自動的に閉じるまでの時間
  close_help: 自動表示にはマルチプレイ状況と収縮タイマーの有効化が必要です。味方ごとに表示時間を計測します
  seconds: '{value} 秒'
  comment: 既定の称賛コメント
  save: 保存
  show_recent: 味方を表示
  manual: 味方ウィンドウを手動で開く
  manual_help: 味方がパーティーに残っている場合や DAY1 を検出できなかった場合に使用します
  window: オーバーレイ
  status: 動作状態
  dismiss: 閉じる
overlay:
  title: 試合後の称賛
  send: 設定したコメントをこの味方の Steam プロフィールに投稿
  open_profile: クリックして Steam のプロフィールを開く
state:
  restoring: 一時ブロックの解除を待っています
  idle: 味方を待機中
  ready: 称賛ボタンでコメントを投稿
  sending: 送信中…
  sent: 投稿済み。7日間は再送信しません
  cooldown: 7日間の送信間隔内です
  unknown: 結果未確認。プロフィールを確認するまで再送信を停止します
  retry_later: Steam に受理されませんでした。後で再試行できます
  precondition: コメント不可またはアカウント未準備。プロフィールを確認してください
  rejected: Steam に受理されませんでした。後で再試行してください
  error: 準備に失敗。Steam とゲームを起動したまま再試行してください
  history_error: コメント履歴に異常があります。プロフィールを確認してください
  account_missing: Steam ログインアカウントを取得できません
  account_changed: Steam アカウントが変更されたか確認できません。再度参加してください
  helper_missing: コメント補助プログラムを起動できません
  invalid_comment: 1～500文字のコメントを入力してください
  saved: コメントを保存しました
  disabled: 試合後の称賛機能を有効にしてください
