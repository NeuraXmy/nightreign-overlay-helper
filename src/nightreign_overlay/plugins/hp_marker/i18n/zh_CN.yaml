plugin:
  name: 血量阈值标记
  description: 自动检测血条长度，在血条上方显示低血量、高血量和满血参考线。
settings:
  basic: 标定与阈值标记
  advanced: 高级检测与绘制选项
  detection_algorithm:
    title: 血条识别算法
    content: 新版根据水平中线的边界结构和连续帧证据识别，初次确认需等待数帧；旧版使用亮度峰和历史平滑。检测失败时均保留已有标记。
    legacy: 旧版
    structural: 新版
  region:
    title: 血条区域
    content: 左边缘紧贴血条，选区水平中线穿过血条内部；上下可略超出，检测时自动向右扩展。
    annotate: 点我并框出 血条 的区域
    button: 标定
  hpbar_low_hp_marker:
    title: 低血量标记比例
    content: 默认 0.40（40%），用于参考血量偏低时触发的词条位置。
  hpbar_high_hp_marker:
    title: 高血量标记比例
    content: 默认 0.85（85%）；第三条满血标记固定为 100%。
  marker_size:
    title: 标记大小
    content: 同时缩放楔形标记的宽度和高度，范围 50%–300%，默认 100%；基准宽高可在高级选项中调整。
  marker_color:
    title: 标记颜色
  line_width:
    title: 标记线宽
    content: 楔形标记顶部宽度，Qt 逻辑像素，默认 3；随屏幕 DPI 自动缩放。
  line_height:
    title: 标记线高
    content: 楔形标记高度，Qt 逻辑像素，默认 7；随屏幕 DPI 自动缩放，尖端朝下。
  hpbar_region_aspect_ratio:
    title: 检测区域宽高比
    content: 检测宽度为选区高度乘此值，默认 125；不使用框选宽度。
  hpbar_detect_std_height:
    title: 旧版：检测标准高度
    content: 检测前保持宽高比缩放到此高度，默认 15；会影响亮度峰的位置和分数。
  hpbar_border_v_peak_start:
    title: 旧版：边界检测起点
    content: 从缩放后图像的此横坐标开始查找亮度峰，默认 30。
  hpbar_border_v_peak_lower:
    title: 旧版：边界最低亮度
    content: HSV 亮度通道须高于此值，默认 100；提高数值会更严格。
  hpbar_border_v_peak_threshold:
    title: 旧版：边界亮度提升阈值
    content: 与前方像素的亮度差须大于此值，默认 75；提高数值会更严格。
  hpbar_border_v_peak_interval:
    title: 旧版：边界检测亮度区间
    content: 向前比较的像素区间，默认 30；至少一半比较满足条件才视为亮度峰。
  hpbar_recent_length_count:
    title: 旧版：血条长度历史样本数
    content: 保留最近的检测样本用于聚类和平滑，默认 10；改变数值会影响稳定性和响应速度。
