plugin:
  name: 血量阈值标记
  description: 自动检测血条长度，在血条上方显示血量较低词条、血量不满词条触发的血量参考线
settings:
  basic: 基本设置
  advanced: 高级选项
  region:
    title: 血条区域
    content: 框选左边缘紧贴血条左侧，宽度和血条一致的区域，可点击「标定」或设置快捷键
    annotate: 点我并框出 “血条左侧” 的区域
    button: 标定
  hpbar_low_hp_marker:
    title: 血量较低词条触发比例
  hpbar_high_hp_marker:
    title: 血量不满词条触发比例
  marker_size:
    title: 标记大小
  marker_color:
    title: 标记颜色
  line_width:
    title: 标记线宽
  line_height:
    title: 标记线高
  hpbar_region_aspect_ratio:
    title: 检测区域宽高比
    content: 检测宽度为标定高度乘此值
  hpbar_detection_offset:
    title: 检测长度偏移
    content: 对检测到的血条长度增加像素偏移，正值向右校正
