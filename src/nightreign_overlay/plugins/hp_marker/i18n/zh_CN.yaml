plugin:
  name: 血量阈值标记
  description: 自动检测血条长度，在血条上方显示低血量、高血量和满血参考线。
settings:
  basic: 标定与阈值标记
  advanced: 高级检测与绘制选项
  region:
    title: 血条区域
    content: 高度与血条一致，左边缘紧贴血条；选区宽度不限，检测时自动向右扩展。
    annotate: 点我并框出 血条 的区域
    button: 标定
  keep_last_valid:
    title: 检测失败时保持上次结果（旧版兼容）
    content: 保留旧版设置值；旧版实际未使用此开关，检测失败时始终保留已显示的结果。
  hpbar_low_hp_marker:
    title: 低血量标记比例
    content: 默认 0.40（40%），用于参考血量偏低时触发的词条位置。
  hpbar_high_hp_marker:
    title: 高血量标记比例
    content: 默认 0.85（85%）；第三条满血标记固定为 100%。
  marker_color:
    title: 标记颜色
  line_width:
    title: 标记线宽
    content: 物理像素，默认 3；显示时按屏幕 DPI 换算并截断。
  line_height:
    title: 标记线高
    content: 物理像素，默认 7；三条标记位于血条上方。
  hpbar_region_aspect_ratio:
    title: 检测区域宽高比
    content: 检测宽度为选区高度乘此值，默认 125；不使用框选宽度。
  hpbar_detect_std_height:
    title: 检测标准高度
    content: 检测前保持宽高比缩放到此高度，默认 15；会影响亮度峰的位置和分数。
  hpbar_border_v_peak_start:
    title: 边界检测起点
    content: 从缩放后图像的此横坐标开始查找亮度峰，默认 30。
  hpbar_border_v_peak_lower:
    title: 边界最低亮度
    content: HSV 亮度通道须高于此值，默认 100；提高数值会更严格。
  hpbar_border_v_peak_threshold:
    title: 边界亮度提升阈值
    content: 与前方像素的亮度差须大于此值，默认 75；提高数值会更严格。
  hpbar_border_v_peak_interval:
    title: 边界检测亮度区间
    content: 向前比较的像素区间，默认 30；至少一半比较满足条件才视为亮度峰。
  hpbar_recent_length_count:
    title: 血条长度历史样本数
    content: 保留最近的检测样本用于聚类和平滑，默认 10；改变数值会影响稳定性和响应速度。
