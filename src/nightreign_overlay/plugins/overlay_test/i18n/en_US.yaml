plugin:
  name: Overlay test
  description: A standalone demo overlay for checking dragging, scaling, opacity, click-through and window mode

overlay:
  title: Overlay test
  countdown: "{seconds} s remaining"
  game_unknown: "Game: not detected"
  game_foreground: "Game: focused"
  game_background: "Game: background"
  mode_transparent: Transparent overlay
  mode_window: Regular window

settings:
  content:
    title: Test content
  cycle_seconds:
    title: Countdown cycle
    content: The countdown restarts automatically when it reaches zero
    value: "{seconds} s"
  accent_color:
    title: Accent color
    content: Color of the title and progress bar
  show_background:
    title: Show background panel
    content: Turn off to draw only text and the progress bar, useful for checking transparency
  restart:
    title: Restart countdown
    content: Calls the OverlayTestApi provided by this plugin through the service registry
    button: Restart
