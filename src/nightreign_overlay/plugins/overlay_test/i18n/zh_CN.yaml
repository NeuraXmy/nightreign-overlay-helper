plugin:
  name: 悬浮窗测试
  description: 一个独立的演示悬浮窗，用于检查拖动、缩放、透明度、鼠标穿透与窗口模式等基础功能

overlay:
  title: 悬浮窗测试
  countdown: "倒计时 {seconds} 秒"
  game_unknown: 游戏：未检测
  game_foreground: 游戏：前台
  game_background: 游戏：后台
  mode_transparent: 透明悬浮窗
  mode_window: 普通窗口

settings:
  content:
    title: 测试内容
  cycle_seconds:
    title: 倒计时周期
    content: 倒计时归零后自动重新开始
    value: "{seconds} 秒"
  accent_color:
    title: 强调色
    content: 标题与进度条的颜色
  show_background:
    title: 显示背景面板
    content: 关闭后只绘制文字与进度条，用于检查透明背景
  restart:
    title: 重新开始倒计时
    content: 通过服务注册表调用本插件提供的 OverlayTestApi
    button: 重新开始
