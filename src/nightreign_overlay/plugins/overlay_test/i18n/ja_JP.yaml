plugin:
  name: オーバーレイテスト
  description: ドラッグ・拡大縮小・不透明度・クリック透過・ウィンドウモードなどの基本機能を確認するデモ用オーバーレイ

overlay:
  title: オーバーレイテスト
  countdown: "残り {seconds} 秒"
  game_unknown: ゲーム：未検出
  game_foreground: ゲーム：前面
  game_background: ゲーム：背面
  mode_transparent: 透過オーバーレイ
  mode_window: 通常ウィンドウ

settings:
  content:
    title: テスト内容
  cycle_seconds:
    title: カウントダウン周期
    content: ゼロになると自動的に再開します
    value: "{seconds} 秒"
  accent_color:
    title: アクセントカラー
    content: タイトルとプログレスバーの色
  show_background:
    title: 背景パネルを表示
    content: オフにすると文字とプログレスバーのみ描画し、透過の確認に使えます
  restart:
    title: カウントダウンを再開
    content: サービスレジストリ経由でこのプラグインの OverlayTestApi を呼び出します
    button: 再開
