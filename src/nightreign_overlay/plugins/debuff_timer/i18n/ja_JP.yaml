plugin:
  name: 状態異常ゲージタイマー
  description: 状態異常ゲージを検出し、瓦礫の王の遺物効果による攻撃力上昇の段階と次回判定までのカウントダウンを表示します
hud:
  text: 状態異常ゲージで攻撃力上昇 Lv.{level} 次回判定 {remaining}s
settings:
  basic: 基本設定
  start: 手動でカウントダウン開始
  end: 手動でカウントダウン停止
  region:
    title: 状態異常ゲージの範囲
    content: 状態異常アイコンと右側のゲージが表示される範囲全体を選択
    button: 範囲指定
    annotate: ここをクリックし、状態異常アイコンとゲージの表示範囲を選択
  advanced:
    title: 詳細設定
    first_check_advance:
      title: 初回判定の前倒し時間
      content: 検出遅延を補正するため、初回判定をこの秒数だけ早めます
audio:
  check: 各カウントダウン終了時の通知
