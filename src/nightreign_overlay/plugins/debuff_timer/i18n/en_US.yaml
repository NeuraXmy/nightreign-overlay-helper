plugin:
  name: Status Buildup Timer
  description: Detects status buildup meters and displays attack power stacks from the Dreglord relic effect and the countdown to the next check.
    check
hud:
  text: Status buildup attack boost Lv.{level} Next check {remaining}s
settings:
  basic: Basic
  start: Manually start countdown
  end: Manually stop countdown
  region:
    title: Status buildup meter area
    content: Select the full area where status icons and their meters can appear
    button: Calibrate
    annotate: Click here, then select the area containing status icons and meters
  advanced:
    title: Advanced options
    first_check_advance:
      title: First check advance
      content: Start the first check early by this amount to compensate for detection latency
audio:
  check: Countdown checkpoint reminder
