plugin:
  name: 截图引擎
  description: 为检测插件提供统一的游戏画面。
settings:
  title: 截图设置
  mode:
    title: 截图方式
    content: 默认旧版截图，桌面歌词等画面遮挡会影响检测；仅前台/仅后台方式可能导致窗口大小变化
    legacy: 旧版
    foreground: 仅前台
    background: 仅后台
  interval:
    title: 检测间隔
    content: 所有识别功能共享的检测间隔，更短的间隔反应更灵敏，但会消耗更多性能
    value: "{milliseconds} ms"
  hdr:
    title: 启用 HDR 图像处理
    content: 若游戏开启 HDR 模式，启动该选项可能提高识别准确性
  game_window:
    title: 游戏画面区域
    content: 标定实际游戏画面区域，用于其他功能自动标定区域的计算；未设置时在进入游戏后自动判断。
    button: 标定
    annotate: 框选实际游戏画面区域
    failed_title: 游戏画面标定失败
    failed_content: 标定区域需接近 16:9。自动标定区域仅支持 16:9 游戏画面，已清空本次标定。
