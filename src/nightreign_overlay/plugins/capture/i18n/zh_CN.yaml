plugin:
  name: 截图引擎
  description: 为检测插件提供统一的游戏画面。
settings:
  title: 截图设置
  mode:
    title: 截图方式
    content: 自动测速选择最快方式；也可固定单一方式（如 GDI）排查兼容性问题
    auto: 自动
    foreground: 仅前台
    background: 仅后台
    gdi: GDI
    framepool: FramePool (WGC)
    dxgi_desktop_dup: DXGI 桌面复制
    dxgi_desktop_dup_window: DXGI 窗口复制
    printwindow: PrintWindow
    screendc: ScreenDC
  process:
    title: 截图进程
    content: 默认按窗口标题自动检测游戏窗口；使用 PS5 串流等方式游玩时，请手动选择提供游戏画面的进程
    auto: 自动检测
    current: "当前：{process}"
    dialog_title: 选择截图进程
    dialog_hint: 选择提供游戏画面的窗口（例如 PS5 串流软件）
    confirm: 确定
    cancel: 取消
  interval:
    title: 检测间隔
    content: 所有识别功能共享的检测间隔，更短的间隔反应更灵敏，但会消耗更多性能
    value: "{milliseconds} ms"
  hdr:
    title: 启用 HDR 图像处理
    content: 若游戏开启 HDR 模式，启动该选项可能提高识别准确性
  game_window:
    title: 游戏画面区域
    content: 以 16:9 为准自动获取游戏画面的大小，并自动计算各个功能的标定区域；也可以手动标定游戏画面（不包括上下黑边）
    button: 标定
    annotate: 框选实际游戏画面区域
    failed_title: 游戏画面标定失败
    failed_content: 标定区域需接近 16:9。自动标定区域仅支持 16:9 游戏画面，已清空本次标定。
