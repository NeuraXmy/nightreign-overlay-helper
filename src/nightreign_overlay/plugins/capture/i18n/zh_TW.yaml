plugin:
  name: 畫面擷取引擎
  description: 為辨識外掛提供統一的遊戲畫面
settings:
  title: 畫面擷取設定
  mode:
    content: 預設為舊版擷取；桌面歌詞等遮擋會影響辨識。僅前景／僅背景模式可能改變視窗大小
    title: 擷取方式
    auto: 自動
    foreground: 僅前景
    background: 僅背景
    gdi: GDI
    framepool: FramePool（WGC）
    dxgi_desktop_dup: DXGI 桌面複製
    dxgi_desktop_dup_window: DXGI 視窗複製
    printwindow: PrintWindow
    screendc: ScreenDC
  process:
    title: 擷取程序
    content: 預設依視窗標題自動偵測；使用串流等方式時，可以指定提供遊戲畫面的程序
    auto: 自動偵測
    current: "目前：{process}"
    dialog_title: 選擇擷取程序
    dialog_hint: 選擇提供遊戲畫面的視窗
    confirm: 確定
    cancel: 取消
  interval:
    title: 辨識間隔
    content: 所有辨識功能共用；間隔越短反應越快，但耗用更多效能
    value: '{milliseconds} ms'
  hdr:
    title: 啟用 HDR 影像處理
    content: 遊戲啟用 HDR 時，此選項可能提升辨識準確度
  game_window:
    title: 遊戲畫面區域
    content: 標定實際遊戲畫面區域，用於計算其他功能的自動標定區域；未設定時會在進入遊戲後自動判斷。
    button: 標定
    annotate: 框選實際遊戲畫面區域
    failed_title: 遊戲畫面標定失敗
    failed_content: 標定區域需接近 16:9。自動標定區域僅支援 16:9 遊戲畫面，已清除本次標定。
