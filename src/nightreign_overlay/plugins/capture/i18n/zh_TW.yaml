plugin:
  name: 畫面擷取引擎
  description: 為辨識外掛提供統一的遊戲畫面
settings:
  title: 畫面擷取設定
  mode:
    content: 固定使用所選截圖方法；點擊「自動檢測」可選擇最快的有效方法
    title: 擷取方式
    auto: 自動 (Maa)
    foreground: 僅前景
    background: 僅背景
    gdi: GDI
    framepool: FramePool（WGC）
    dxgi_desktop_dup: DXGI 桌面複製
    dxgi_desktop_dup_window: DXGI 視窗複製
    printwindow: PrintWindow
    screendc: ScreenDC
    mss: 相容 (mss)
  process:
    title: 擷取程序
    content: 預設依視窗標題自動偵測；使用串流等方式時，可以指定提供遊戲畫面的程序
    auto: 自動偵測
    current: "目前：{process}"
    dialog_title: 選擇擷取程序
    dialog_hint: 選擇提供遊戲畫面的視窗
    confirm: 確定
    cancel: 取消
  interval:
    title: 辨識間隔
    content: 所有辨識功能共用；間隔越短反應越快，但耗用更多效能
    value: '{milliseconds} ms'
  hdr:
    title: 啟用 HDR 影像處理
    content: 遊戲啟用 HDR 時，此選項可能提升辨識準確度
  game_window:
    title: 遊戲畫面區域
    content: 標定實際遊戲畫面區域，用於計算其他功能的自動標定區域；未設定時會在進入遊戲後自動判斷。
    button: 標定
    annotate: 框選實際遊戲畫面區域
    failed_title: 遊戲畫面標定失敗
    failed_content: 標定區域需接近 16:9。自動標定區域僅支援 16:9 遊戲畫面，已清除本次標定。

detection:
  title: 截圖方法檢測
  description: 自動檢測並儲存最快的有效截圖方法，詳細結果寫入日誌。無需啟動遊戲；檢測失敗時使用 mss。
  ready: 可重新檢測並更新目前固定截圖方法。
  display: 測試顯示器
  testing: 正在檢測…
  confirm: 是否自動檢測適合目前裝置的截圖方法？（大約需要5秒時間）
  start: 自動檢測
  cancel: 取消檢測
  running: 正在檢測，請保持測試視窗可見。按 Esc 結束測試會退回 mss。
  success: 檢測完成，已儲存最優截圖方法。
  failed: '檢測失敗，已切換至 mss。原因：{reason}'
  cancelled: 已取消檢測，保留原截圖設定。
  failure:
    platform: 目前平台不支援 DirectX 測試
    component: 缺少截圖檢測元件
    start: 測試視窗無法啟動
    process: 測試程式異常結束
    timeout: 檢測逾時
    validation: 檢測未完成或沒有方法通過畫面驗證
    display: 無法取得測試顯示器
