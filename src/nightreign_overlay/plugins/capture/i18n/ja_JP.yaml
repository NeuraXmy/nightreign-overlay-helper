plugin:
  name: 画面キャプチャ
  description: 認識プラグインに共通のゲーム画像を提供
settings:
  title: キャプチャ設定
  mode:
    content: 選択した方式を固定で使用します。「自動検出」で有効な最速方式を選択できます
    title: キャプチャ方式
    auto: 自動 (Maa)
    foreground: 前面のみ
    background: 背面のみ
    gdi: GDI
    framepool: FramePool（WGC）
    dxgi_desktop_dup: DXGIデスクトップ複製
    dxgi_desktop_dup_window: DXGIウィンドウ複製
    printwindow: PrintWindow
    screendc: ScreenDC
    mss: 互換 (mss)
  process:
    title: キャプチャ対象プロセス
    content: 通常はウィンドウタイトルから自動検出します。リモートプレイでは映像を提供するプロセスを指定できます
    auto: 自動検出
    current: "現在：{process}"
    dialog_title: キャプチャ対象プロセスを選択
    dialog_hint: ゲーム映像を提供するウィンドウを選択してください
    confirm: OK
    cancel: キャンセル
  interval:
    title: 認識間隔
    content: 全認識機能で共有。短いほど反応が速くなりますが、負荷も増えます
    value: '{milliseconds} ms'
  hdr:
    title: HDR画像処理を有効化
    content: ゲームでHDRを使用している場合、認識精度が改善することがあります
  game_window:
    title: ゲーム画面範囲
    content: 他の機能の自動範囲設定に使うため、実際のゲーム画面を指定します。未設定の場合はゲーム起動後に自動判定します。
    button: 範囲指定
    annotate: 実際のゲーム画面範囲を選択
    failed_title: ゲーム画面の範囲指定に失敗
    failed_content: 選択範囲は16:9に近い必要があります。自動範囲設定は16:9のゲーム画面のみ対応するため、今回の設定を解除しました。

detection:
  title: キャプチャ方式のテスト
  description: 有効な最速のキャプチャ方式をテストして保存します。詳細な結果はログに記録します。ゲームは不要です。失敗時は mss を使用します。
  ready: テストを実行すると現在の固定方式を更新できます。
  display: テストする画面
  testing: テスト中…
  confirm: この端末に適したキャプチャ方式を自動検出しますか？（約5秒かかります）
  start: 自動検出
  cancel: テスト中止
  running: テスト中です。画面を隠さないでください。Esc で終了すると mss に切り替わります。
  success: テストが完了し、最適なキャプチャ方式を保存しました。
  failed: 'テスト失敗。mss に切り替えました。理由：{reason}'
  cancelled: テストを中止し、元の設定を保持しました。
  failure:
    platform: この環境では DirectX テストを利用できません
    component: テスト用コンポーネントがありません
    start: テスト画面を起動できません
    process: テストプログラムが異常終了しました
    timeout: テストがタイムアウトしました
    validation: テストが未完了か、画像検証に成功した方式がありません
    display: テスト画面を取得できません
