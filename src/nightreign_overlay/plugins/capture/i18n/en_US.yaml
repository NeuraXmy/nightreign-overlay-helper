plugin:
  name: Capture Engine
  description: Provide shared game frames for detection plugins
settings:
  title: Capture settings
  mode:
    title: Capture method
    content: Legacy is the default; desktop overlays can affect detection. Foreground/background modes may resize
      the window
    legacy: Legacy
    foreground: Foreground only
    background: Background only
  interval:
    title: Detection interval
    content: Shared by all detectors; shorter intervals respond faster but use more resources
    value: '{milliseconds} ms'
  hdr:
    title: HDR image processing
    content: May improve detection when HDR is enabled in the game
  game_window:
    title: Game area
    content: Calibrate the actual game area for calculating automatic regions used by other features. If unset, it is detected automatically after entering the game.
    button: Calibrate
    annotate: Select the actual game area
    failed_title: Game area calibration failed
    failed_content: The selected area must be close to 16:9. Automatic regions support only 16:9 game areas; the calibration has been cleared.
