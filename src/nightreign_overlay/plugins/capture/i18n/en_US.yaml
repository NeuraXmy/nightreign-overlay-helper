plugin:
  name: Capture Engine
  description: Provide shared game frames for detection plugins
settings:
  title: Capture settings
  mode:
    content: Automatic mode uses Maa and waits when the game window is unavailable. Use Compatibility (mss) for macOS development or full-desktop capture. Foreground/background modes may resize
    title: Capture method
    auto: Auto (Maa)
    foreground: Foreground only
    background: Background only
    gdi: GDI
    framepool: FramePool (WGC)
    dxgi_desktop_dup: DXGI desktop duplication
    dxgi_desktop_dup_window: DXGI window duplication
    printwindow: PrintWindow
    screendc: ScreenDC
    mss: Compatibility (mss)
  process:
    title: Capture process
    content: The game window is auto-detected by title; for remote play, pin the process that provides the game image
    auto: Auto-detect
    current: "Current: {process}"
    dialog_title: Choose capture process
    dialog_hint: Pick the window that provides the game image
    confirm: OK
    cancel: Cancel
  interval:
    title: Detection interval
    content: Shared by all detectors; shorter intervals respond faster but use more resources
    value: '{milliseconds} ms'
  hdr:
    title: HDR image processing
    content: May improve detection when HDR is enabled in the game
  game_window:
    title: Game area
    content: Automatically determine the game image size using a 16:9 reference and calculate each feature region; you can also calibrate the game image manually (excluding top and bottom black bars)
    button: Calibrate
    annotate: Select the actual game area
    failed_title: Game area calibration failed
    failed_content: The selected area must be close to 16:9. Automatic regions support only 16:9 game areas; the calibration has been cleared.
