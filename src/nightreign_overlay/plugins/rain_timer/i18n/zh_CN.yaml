plugin:
  name: 雨中冒险计时
  description: 根据血条颜色识别淋雨状态并显示大幅受伤前的倒计时
hud:
  text: "雨中冒险倒计时 {remaining} - {percent}%"
settings:
  basic:
    title: 基本设置
  auto:
    title: 雨中冒险自动计时
    content: 根据标定区域内的血条颜色，自动开始或停止雨中冒险倒计时
  region:
    title: 血条检测区域
    content: 未标定时自动适配 16:9 游戏窗口；手动框选血条左侧纯色内部后优先使用所选区域
    button: 标定
    annotate: 点我并框出 “血条纯色内部” 的区域
  toggle:
    title: 手动开始/停止雨中冒险
    button: 开始/停止
  color:
    title: 参考血条颜色
    calibrate:
      title: 校准血条颜色
      content: 自动计时因色差失效时，框选正常血条和雨中血条以记录实际颜色，可点击「校准」或设置快捷键
      button: 校准
    not_in_rain_annotate: 点我并框出 “正常颜色血条” 的区域
    in_rain_annotate: 点我并框出 “雨中颜色血条” 的区域
    status:
      title: 参考颜色
    not_in_rain: "正常血条颜色:"
    in_rain: "雨中血条颜色:"
    default: 默认
    set: 已设置
    hdr_prefix: "HDR:"
    reset: 重置
    reset_title: 确认
    reset_confirm: 确定要重置{mode}下的血条颜色设置为默认吗？
    mode_hdr: HDR模式
    mode_normal: 普通模式
  advanced:
    title: 高级选项
  duration:
    title: 大幅受伤开始时间
  h_tolerance:
    title: 色相容差
  l_tolerance:
    title: 亮度容差
  s_tolerance:
    title: 饱和度容差
  min_area_percent:
    title: 干扰色面积最小占比
    content: 另一种颜色的面积占比不高于此值时才进行判定
  max_area_percent:
    title: 主颜色面积最大占比
    content: 某种颜色的面积占比达到此值时，认为血条为该颜色

audio:
  start: 雨中冒险开始
  warning: 雨中冒险即将结束
  end: 雨中冒险结束
