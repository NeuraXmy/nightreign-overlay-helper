plugin:
  name: 缩圈计时
  description: 自动识别游戏中每天的开头，并显示缩圈倒计时
hud:
  map_ready: " - 地图识别就绪"
  waiting: 等待游戏开始
  phase: "DAY {day} - {remaining} 后第{circle}圈{action}"
  circle:
    first: 一
    second: 二
  action:
    start: 开始缩圈
    end: 缩圈结束
  boss: "DAY {day} - 夜晚BOSS战 {elapsed}"
  day3: "DAY {day} - {elapsed}"
settings:
  basic:
    title: 基本设置
  auto:
    title: 自动识别
    content: 根据标定区域识别 DAY I/II 图标并自动开始计时
  language:
    title: 游戏语言
    chs: 简体中文
    cht: 繁體中文
    eng: English
    jp: 日本語
  calibrate:
    title: DAY I 图标区域
    content: 未标定时自动适配 16:9 游戏窗口；手动框选 DAY I 图标后优先使用所选区域
    button: 标定
    annotate: 点我并框出 “DAY I 图标” 的区域
  manual:
    title: 手动调整计时
    next_day: 开始下一天
    backward: 快退
    forward: 快进
  shortcuts:
    title: 快捷键
    next_day:
      title: 开始下一天
    forward:
      title: 快进计时
    backward:
      title: 回退计时
  advanced:
    title: 高级选项
  forward:
    title: 快进秒数
  backward:
    title: 回退秒数
  threshold:
    title: DAY X 模板匹配阈值
    content: 数值越小，匹配越严格

audio:
  day1: DAY I 开始
  day2: DAY II 开始
  day3: DAY III 开始
  first_circle: 即将开始一缩（每天共用）
  second_circle: 即将开始二缩（每天共用）
