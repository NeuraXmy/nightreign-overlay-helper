  duchess: Finale invisibility
  recluse: Soulblood Song marks
  revenant: Immortal March invincibility
  scholar: Communion links
  executor: Aspects of the Crucible form
roles:
  duchess: Duchess
  recluse: Recluse
  revenant: Revenant
  scholar: Scholar
  executor: Executor
settings:
  undertaker_enabled:
    title: Detect Undertaker extra Ultimate time
  undertaker_threshold:
    title: Undertaker extra Ultimate pink coverage threshold
  undertaker_duration:
    title: Undertaker extra Ultimate duration
  basic:
    title: Basic
  region:
    title: Ultimate Art icon area
