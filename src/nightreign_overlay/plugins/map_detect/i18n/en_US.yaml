  recognize: Recognize again
  manual_filter: Manual filter
  exit_filter: Exit filter
  candidates: Map candidates
  crystals: Crystal layout
  previous: Previous
  next: Next
manual_filter:
  title: Manual filter
  earth_shifting: Shifting Earth
  unselected: Not selected
  nightlord: BOSS
  all_nightlords: All
  auto_recognize: Auto detect
  empty: Empty
  select_earth_shifting: Select Shifting Earth
  recognizing_entry: Detecting Shifting Earth and Nightlord…
  remaining_candidates: 'Maps remaining: {count}'
  apply_now: Apply now
  no_match: No matches; adjust your filters
overlay:
  result: 'Result: {index}/{total}'
  crystal: 'Crystal layout: '
  all: All
