  basement: 'Basement: {name}'
  flask: Flask
  floor_boss: '{floor}F: {name}'
  blessing: Blessing
  hidden_nightlord: ' (hidden Nightlord)'
  upper_left: upper left
  lower_right: lower right
  day2_circle: 'Day 2 first circle: {position}'
