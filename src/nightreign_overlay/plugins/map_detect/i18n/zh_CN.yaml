plugin:
  name: 地图信息
  description: 自动或手动识别地图，显示地图详细详细
controls:
  title: 地图信息操控栏
  recognize: 重新识别
  manual_filter: 手动筛选
  exit_filter: 退出筛选
  candidates: 地图候选
  crystals: 水晶布局
  previous: 上一个
  next: 下一个
manual_filter:
  title: 手动筛选
  earth_shifting: 特殊地形
  unselected: 未选择
  nightlord: BOSS
  all_nightlords: 所有
  auto_recognize: 自动识别
  empty: 空
  select_earth_shifting: 请选择特殊地形
  recognizing_entry: 正在识别特殊地形和夜王...
  remaining_candidates: "剩余候选地图数量：{count}"
  apply_now: 立刻应用
  no_match: 筛选为空，请重新设置
overlay:
  result: "识别结果: {index}/{total}"
  crystal: "水晶布局: "
  all: 所有
  matching: "正在识别中... {spinner}"
  elapsed: "识别时间：{elapsed}前"
  duration:
    hours: "{hours}小时{minutes}分钟{seconds}秒"
    minutes: "{minutes}分钟{seconds}秒"
    seconds: "{seconds}秒"
  legend:
    crystal: 水晶点位
    underground: 地下水晶点位
    extra: 额外水晶点位
drawing:
  unknown_boss: 未知BOSS
  day_boss: "Day{day} {name}"
  extra_boss: "额外Boss:{name}"
  rooftop: "楼顶:{name}"
  basement: "地下室:{name}"
  flask: 血瓶
  floor_boss: "{floor}F: {name}"
  blessing: 庇佑
  hidden_nightlord: " (隐藏夜王)"
  upper_left: 左上
  lower_right: 右下
  day2_circle: "Day2第一次缩圈位置：{position}"
  event: "特殊事件: {name}"
settings:
  browser:
    card_title: 查询指定地图
    browse: 查询
    window_title: 查询指定地图
    input_label: "输入地图ID："
    placeholder: 输入地图 ID
    drawing: 绘制中...
    invalid: 请输入有效的地图 ID
    not_found: 未找到该地图 ID
    done: "地图 #{id}"
  force_display:
    title: 强制显示悬浮窗
    content: 因某些原因无法识别时，可以通过该选项强制打开悬浮窗，进行手动筛选；仍然需要预先标定地图区域
    enter: 进入强制显示
    exit: 退出强制显示
  basic: 基本设置
  hotkeys: 快捷键
  advanced: 高级选项
  manual_filter:
    title: 进入／退出手动筛选
    content: 在地图区域显示可交互的筛选悬浮窗；再次执行会退出筛选
  calibrate_region:
    action: 标定
    title: 地图区域
    content: 框选完整地图，边缘与地图边框贴合，可点击「标定」或设置快捷键
    annotate: 点我并框出 “地图” 的区域
  recognize:
    title: 识别地图
    content: 清除旧结果，在下一次完整地图显示且地形清晰时识别
  toggle:
    title: 显示／隐藏地图信息
  next_result:
    title: 下一个识别结果
  previous_result:
    title: 上一个识别结果
  next_crystal:
    title: 下一个水晶布局
  previous_crystal:
    title: 上一个水晶布局
  topk:
    title: 识别结果返回数量
    content: 可切换候选结果，避免首选结果出错；设置过大的数量会降低识别速度，有可能导致程序崩溃
  english_text_width:
    title: 英文地标文字宽度
  match_interval:
    title: 重新匹配间隔
    content: 经过多长时间后会重新开始匹配；若缩圈计时未启用，该间隔用于保证进入新的一局时能自动重新识别
  full_map_error_threshold:
    title: 完整地图识别 - 误差阈值
    content: 判断当前画面是否为完整地图的误差上限。数值越大越宽松，也更容易误判
  map_stability_change_threshold:
    title: 地图稳定识别 - 画面变化阈值
    content: 稳定检测中，连续截图的主体变化超过此灰度差时会重新计时。数值越大越宽松
  map_stability_duration:
    title: 地图稳定识别 - 最小持续时间
    content: 完整地图画面需持续稳定的时间，单位为秒；时间越长越能避开淡入淡出过程
  poi_algorithm:
    title: 据点识别 - 算法
    template: 模板匹配
    cnn: CNN
  earth_shifting_algorithm:
    title: 特殊地形识别 - 算法
    ncc: NCC
    template: 模板匹配
  earth_shifting_ncc_threshold:
    title: 特殊地形识别 - NCC 阈值
    content: 仅用于 NCC 算法，相关系数低于此值时拒绝识别。数值越大越严格
  earth_shifting_error_threshold:
    title: 特殊地形识别 - 模板匹配误差阈值
    content: 仅用于模板匹配算法，误差高于此值时拒绝识别。数值越大越宽松
  subicon_template_match_threshold:
    title: 据点识别 - 模板匹配子图标阈值
    content: 子图标模板匹配分数高于此值时视为没有子图标；数值越大越容易保留子图标
  poi_match_sample_ratio_w_nightlord:
    title: 据点识别 - 已匹配夜王时采样比例
    content: 已确定夜王时用于据点匹配的采样点比例。降低数值可减少耗时，但可能降低识别稳定性
  poi_match_sample_ratio_wo_nightlord:
    title: 据点识别 - 未匹配夜王时采样比例
    content: 未确定夜王时用于据点匹配的采样点比例。降低数值可减少耗时，但可能降低识别稳定性
