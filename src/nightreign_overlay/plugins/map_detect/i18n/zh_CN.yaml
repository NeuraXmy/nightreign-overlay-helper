plugin:
  name: 地图信息
  description: 识别完整地图，显示建筑、首领、事件、宝藏与大空洞水晶布局。
controls:
  title: 地图信息操控栏
  recognize: 重新识别
  manual_filter: 手动筛选
  exit_filter: 退出筛选
  candidates: 地图候选
  crystals: 水晶布局
  previous: 上一个
  next: 下一个
manual_filter:
  title: 手动筛选
  earth_shifting: 特殊地形
  nightlord: BOSS
  all_nightlords: 所有
  auto_recognize: 自动识别
  empty: 空
  select_earth_shifting: 请选择特殊地形
  remaining_candidates: "剩余候选地图数量：{count}"
  apply_now: 立刻应用
  no_match: 筛选为空，请重新设置
  no_region: 请先标定地图区域
  selected: "已选择：{name}"
overlay:
  result: "识别结果: {index}/{total}"
  crystal: "水晶布局: "
  all: 所有
  matching: "正在识别中... {spinner}"
  elapsed: "识别时间：{elapsed}前"
  duration:
    hours: "{hours}小时{minutes}分钟{seconds}秒"
    minutes: "{minutes}分钟{seconds}秒"
    seconds: "{seconds}秒"
  legend:
    crystal: 水晶点位
    underground: 地下水晶点位
    extra: 额外水晶点位
drawing:
  unknown_boss: 未知BOSS
  day_boss: "Day{day} {name}"
  extra_boss: "额外Boss:{name}"
  rooftop: "楼顶:{name}"
  basement: "地下室:{name}"
  flask: 血瓶
  floor_boss: "{floor}F: {name}"
  blessing: 庇佑
  hidden_nightlord: " (隐藏夜王)"
  upper_left: 左上
  lower_right: 右下
  day2_circle: "Day2第一次缩圈位置：{position}"
  event: "特殊事件: {name}"
settings:
  force_display:
    title: 强制显示模式
    content: 全图识别失败时保持显示地图窗口与操纵栏，可进入手动筛选；后台仍按实际全图识别结果运行。需先启用插件并标定地图区域。
    enter: 进入强制显示模式
    exit: 退出强制显示模式
  basic: 地图识别
  hotkeys: 快捷键
  advanced: 高级检测选项
  manual_filter:
    title: 进入／退出手动筛选
    content: 在地图区域显示可交互的筛选悬浮窗；再次执行会退出筛选并恢复自动识别。
  calibrate_region:
    action: 标定
    title: 地图区域
    content: 框选完整地图，边缘与地图边框贴合；保存时取左上角的正方形区域。
    annotate: 点我并框出 地图 的区域
  recognize:
    title: 识别地图
    content: 清除旧结果，在下一次完整地图显示且地形清晰时识别；也可绑定游戏内快捷键。
  toggle:
    title: 显示／隐藏地图信息
    content: 手动切换信息显示；完整地图打开或关闭时仍按旧版自动显示或隐藏。
  next_result:
    title: 下一个识别结果
    content: 循环查看候选地图，用实际建筑和首领确认正确结果。
  previous_result:
    title: 上一个识别结果
    content: 反向循环查看候选地图。
  next_crystal:
    title: 下一个水晶布局
    content: 大空洞识别后在全部点位与四种水晶布局间循环。
  previous_crystal:
    title: 上一个水晶布局
    content: 反向循环查看大空洞水晶布局。
  topk:
    title: 识别结果返回数量
    content: 大空洞地表建筑可能相似，请切换候选确认；如内存占用过大，可减少返回数量。
  match_interval:
    title: 自动匹配间隔
    content: 两次自动地图匹配的最短间隔，单位为秒；手动识别不受此限制。
  full_map_error_threshold:
    title: 完整地图误差阈值
    content: 判断当前画面是否为完整地图的误差上限。数值越大越宽松，也更容易误判。
  poi_algorithm:
    title: POI 识别算法
    content: 整图和手动局部识别共用；CNN 使用 CPU 批量推理
    template: 模板匹配
    cnn: CNN
  earth_shifting_algorithm:
    title: 特殊地形识别算法
    content: NCC 比较灰度结构，对亮度和饱和度变化更稳健；模板匹配使用原有颜色匹配方式。
    ncc: NCC
    template: 模板匹配
  earth_shifting_ncc_threshold:
    title: 特殊地形 NCC 阈值
    content: 仅用于 NCC 算法，相关系数低于此值时拒绝识别。范围 −1 至 1，默认 0.4；数值越大越严格。
  earth_shifting_error_threshold:
    title: 特殊地形模板匹配误差阈值
    content: 仅用于模板匹配算法，误差高于此值时拒绝识别。默认 50；数值越大越宽松。
  subicon_template_match_threshold:
    title: POI 子图标阈值
    content: 子图标模板匹配分数高于此值时视为没有子图标；数值越大越容易保留子图标。
  poi_match_sample_ratio_w_nightlord:
    title: 已匹配夜王时采样比例
    content: 已确定夜王时用于 POI 匹配的采样点比例。降低数值可减少耗时，但可能降低识别稳定性。
  poi_match_sample_ratio_wo_nightlord:
    title: 未匹配夜王时采样比例
    content: 未确定夜王时用于 POI 匹配的采样点比例。降低数值可减少耗时，但可能降低识别稳定性。
