plugin:
  name: エンタメ
  description: 味方のダウン状態を検出して音声をループ再生
settings:
  group: 味方ダウン時に自動再生
  enabled:
    title: 味方のダウンを検出
    content: 味方の状態が条件を満たすとループ音声を自動再生
  region:
    title: 味方エリア
    content: 味方の顔アイコン、名前、HPバーを含む範囲を選択
    annotate: 味方の状態表示範囲を選択
    button: 範囲指定
  start:
    title: 再生開始条件
  stop:
    title: 再生停止条件
  all_down: 味方全員がダウン
  all_three: 味方全員が3回ダウン
  all_up: 味方全員が復活
  any_up: 味方の誰かが復活
  self_stop:
    title: 自分のダウン時に再生を停止
  self_region:
    title: 自分のダウンアイコン範囲
    content: 自分がダウンしたときに表示される3分割のリングアイコンを選択
    annotate: 自分のダウンアイコンの範囲を選択
  three_player_only:
    title: 3人プレイ時のみ再生
  advanced:
    title: 詳細設定
    self_recovery_delay:
      title: 自分の復活後に再生を再開するまでの時間
      content: 復活が確定してから再生を許可するまで待機します。初期値は7秒です。再びダウンすると待機をやり直します。0秒で即座に許可します。
    stable_detections:
      title: 状態の確認回数
      content: 自分と味方の状態変化は、同じ結果が連続して指定回数検出された後に確定します。初期値は3回です
audio:
  loop_title: ループ再生音声
