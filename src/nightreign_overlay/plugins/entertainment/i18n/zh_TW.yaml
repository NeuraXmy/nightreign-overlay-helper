plugin:
  name: 娛樂
  description: 隊友倒地狀態辨識與循環音訊播放
settings:
  group: 隊友倒地自動播放
  enabled:
    title: 偵測隊友倒地
    content: 偵測到隊友狀態符合條件時自動播放循環音訊
  region:
    title: 隊友區域
    content: 框選包含隊友頭像、名稱和血條的區域
    annotate: 框選隊友狀態區域
    button: 標定
  start:
    title: 播放開始條件
  stop:
    title: 播放結束條件
  all_down: 隊友全倒地
  all_three: 隊友全三倒
  all_up: 隊友全復活
  any_up: 任一隊友復活
  self_stop:
    title: 自身倒地停止播放
  self_region:
    title: 自身倒地區域
    content: 框選自身倒地時顯示的三段環圖示
    annotate: 框選自身倒地圖示區域
  three_player_only:
    title: 僅三人遊戲時觸發
  advanced:
    title: 進階選項
    self_recovery_delay:
      title: 自身倒地起身後恢復播放時間
      content: 確認自身復活後等待指定秒數才允許播放，預設 7 秒；再次倒地後重新等待，設為 0 秒立即允許播放
    stable_detections:
      title: 狀態確認次數
      content: 自身與隊友狀態變化均需連續偵測到相同結果達指定次數後才確認，預設為 3 次
audio:
  loop_title: 循環播放音訊
