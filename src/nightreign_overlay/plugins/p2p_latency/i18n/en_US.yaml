plugin:
  name: Co-op Status
  description: Show Steam teammates, latency and stability; administrator privileges required
settings:
  window: Overlay
  good_ping: Good latency threshold
  warning_ping: Warning latency threshold
  status: Runtime status
  simulation: 'macOS uses a simulated process: a ~32 s loop of waiting, unknown metrics, latency changes and team changes.
    These are not real measurements'
  show_playtime: Show playtime
  playtime_help: Read total Nightreign playtime from public Steam profiles. Private or missing data stays unavailable. Disabling
    stops requests.
  good_ping_help: Latency below this value is green.
  warning_ping_help: Latency below this value is yellow; higher values are red.
overlay:
  title: Co-op · Ping / Stability
  waiting: Waiting for teammates / Steam sync
  legacy_no_fields: Legacy Steam P2P has no ping or stability fields
  etw_source: 'Latency source: ETW STUN round-trip time'
  open_profile: Click to open this profile in Steam
status:
  helper_missing: Co-op helper not found; run scripts/build_p2p_helper.ps1 when running from source
  helper_started: Co-op helper started
  helper_restarting: Restarting co-op helper
  helper_error: Co-op helper error
  waiting_for_game: Waiting for nightreign.exe
  steam_api_error: Steam API initialization failed; verify game files and sign in to Steam
  steam_ready: Steam API connected
  runtime_error: Failed to read Steam connections
  simulated: macOS simulated data (not real network measurements)
  admin_required: Latency monitoring needs administrator privileges. Restart and allow elevation
  disabled: Co-op status disabled
  running: Running
  stopped: Stopped
  waiting: Waiting
  connected: Connected
  failed: Failed
  detail: 'Status: {message}

    NIGHTREIGN: {game}

    Co-op helper: {helper}

    Steam API: {steam}

    ETW latency: {etw}

    Teammates: {count}'
  etw:
    disabled: Disabled
    waiting: Waiting for game
    starting: Starting
    ready: Enabled
    error: Unavailable; check ETW resources and active tracing sessions
    admin_required: ETW requires administrator privileges. Restart the app as administrator
    simulated: Simulated (ETW disabled)
  game_exited: Game exited
playtime:
  loading: Loading
  unavailable: Unavailable
  hours: '{hours} h'
  available: '{hours} h'
block:
  title: Steam names
  enable: Show players' Steam names
  help: Temporarily block non-friend teammates on Steam to show their Steam names in-game. Restore communication when they leave.
  summary:
    disabled: Off; no temporary blocks in progress.
    enabled: 'On: waiting for valid latency and a confirmed non-friend relationship.'
    preparing: Preparing and checking communication state.
    blocked: Temporarily blocked; leaving, disabling or exiting requests restoration.
    restoring: Restoring communication. Keep Steam online.
    recovery_pending: Recovery unconfirmed; the journal is retained for retry. Keep the original Steam account online.
    retry_wait: Preparation failed; retrying after backoff.
    error: Block not completed. Existing blocks and ineligible accounts are skipped.
    account_missing: Waiting for the network helper to confirm the Steam account.
    unsupported: Automatic block and restore is available on Windows only.
  state:
    preparing: Preparing
    blocked: Blocked
    restoring: Restoring
    recovery_pending: Recovery retry pending
    restored: Restored
    unconfirmed: Recovery unconfirmed
    preblocked: Existing block · preserved
    relationship_skipped: Relationship unconfirmed · skipped
    failed: Block incomplete
    retry_wait: Retry pending
    friend_skipped: Friend skipped
    waiting: Waiting
